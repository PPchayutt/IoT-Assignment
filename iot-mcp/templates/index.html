<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Web Dashboard (REST API)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f6; margin: 0; padding: 25px; text-align: center; color: #1e293b; }
        .dashboard { max-width: 850px; margin: auto; background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #0f172a; }
        .top-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; }
        .card h4 { margin: 0 0 8px; color: #64748b; font-size: 15px; }
        .card .val { font-size: 28px; font-weight: bold; color: #0f172a; }
        .controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .control-box { background: #f1f5f9; padding: 18px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; }
        .btn-toggle { padding: 10px 24px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s; }
        .on { background: #22c55e; box-shadow: 0 4px 10px rgba(34,197,94,0.3); }
        .off { background: #94a3b8; }
        .chart-box { background: #ffffff; padding: 15px; border-radius: 14px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2>IoT Smart Dashboard (Connected via REST API)</h2>

        <div class="top-cards">
            <div class="card">
                <h4>Temperature (LoRa DHT11)</h4>
                <div class="val"><span id="temp">--</span> °C</div>
            </div>
            <div class="card">
                <h4>Humidity (LoRa DHT11)</h4>
                <div class="val"><span id="humid">--</span> %</div>
            </div>
            <div class="card">
                <h4>Distance (Pi Ultrasonic)</h4>
                <div class="val"><span id="dist">--</span> cm</div>
            </div>
        </div>

        <div class="controls-row">
            <div class="control-box">
                <div>
                    <strong>Raspberry Pi LED:</strong>
                    <span id="pi-led-text">OFF</span>
                </div>
                <button id="pi-led-btn" class="btn-toggle off" onclick="togglePiLed()">LED OFF</button>
            </div>
            <div class="control-box">
                <div>
                    <strong>LoRa Node LED:</strong>
                    <span id="lora-led-text">OFF</span>
                </div>
                <button id="lora-led-btn" class="btn-toggle off" onclick="toggleLoraLed()">LORA OFF</button>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="liveChart" height="95"></canvas>
        </div>
    </div>

    <script>
        let piLedState = "OFF";
        let loraLedState = "OFF";

        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Temperature (°C)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.3 },
                    { label: 'Humidity (%)', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.05)', fill: true, tension: 0.3 }
                ]
            },
            options: { responsive: true, animation: false }
        });

        async function fetchDashboardData() {
            try {
                const res = await fetch('/api/sensors');
                const data = await res.json();

                document.getElementById('temp').innerText = data.temperature;
                document.getElementById('humid').innerText = data.humidity;
                document.getElementById('dist').innerText = data.distance;

                piLedState = data.led_status;
                document.getElementById('pi-led-text').innerText = piLedState;
                const piBtn = document.getElementById('pi-led-btn');
                piBtn.className = piLedState === "ON" ? "btn-toggle on" : "btn-toggle off";
                piBtn.innerText = piLedState === "ON" ? "LED ON" : "LED OFF";

                loraLedState = data.lora_led_status;
                document.getElementById('lora-led-text').innerText = loraLedState;
                const loraBtn = document.getElementById('lora-led-btn');
                loraBtn.className = loraLedState === "ON" ? "btn-toggle on" : "btn-toggle off";
                loraBtn.innerText = loraLedState === "ON" ? "LORA ON" : "LORA OFF";

                if (data.history) {
                    liveChart.data.labels = data.history.map(item => item.time);
                    liveChart.data.datasets[0].data = data.history.map(item => item.temperature);
                    liveChart.data.datasets[1].data = data.history.map(item => item.humidity);
                    liveChart.update();
                }
            } catch (err) {
                console.error("Error fetching REST API:", err);
            }
        }

        async function togglePiLed() {
            const nextAction = piLedState === "ON" ? "off" : "on";
            await fetch('/api/led', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: nextAction })
            });
            fetchDashboardData();
        }

        async function toggleLoraLed() {
            const nextAction = loraLedState === "ON" ? "OFF" : "ON";
            await fetch('/api/lora/led', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: nextAction })
            });
            fetchDashboardData();
        }

        setInterval(fetchDashboardData, 2000);
        fetchDashboardData();
    </script>
</body>
</html>
